thresholds:
  red: 5
  yellow: 30
  unknown: 10
riskMessages:
  red: Há riscos relevantes que exigem plano de tratamento antes da modernização. Revisar respostas críticas e priorizar
    redução de acoplamento, integridade, segurança e continuidade.
  yellow: Há lacunas que exigem ações e validação em piloto. Definir responsáveis e critérios de aceite antes de
    ampliar a migração.
  green: Os riscos declarados ficaram abaixo dos limiares. Confirmar evidências e itens críticos; o resultado não
    certifica produção nem exige microserviços.
  unknown: Há informação insuficiente para uma decisão confiável. Realizar descoberta com especialistas antes de
    definir esforço e estratégia.
