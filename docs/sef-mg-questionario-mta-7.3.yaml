# Questionário proposto para MTA 7.3. Importar pela tela Assessment questionnaires.
name: SEF-MG - Arquitetura e Modernização para OpenShift - v1.0
description: Avaliação em português inspirada nos temas do Legacy Pathfinder e ampliada para discussão na Secretaria
  de Estado de Fazenda de Minas Gerais. Conteúdo proposto, não oficial. Avalia riscos atuais e evidências para modularização,
  extração seletiva de serviços e prontidão operacional. Não presume que todo monólito deva virar microserviços.
required: true
sections:
- order: 1
  name: 01. Contexto fazendário e conhecimento da aplicação
  comment: Exemplos de capacidades são hipóteses para discussão com a SEF/MG, não descrição de sua arquitetura atual.
  questions:
  - order: 1
    text: '[CTX01] Os fluxos fazendários críticos e seus responsáveis estão identificados?'
    explanation: 'Evidências: mapa de fluxos de cadastro, arrecadação, fiscalização ou atendimento, conforme o escopo.
      Considere o estado atual comprovado, não apenas planos. Se houver situações diferentes, selecione a de maior
      risco material e registre a justificativa na revisão.'
    answers:
    - order: 1
      text: Fluxos, responsáveis e impactos de indisponibilidade estão documentados e validados.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há mapa parcial ou responsáveis informais.
      risk: yellow
      rationale: Existe atendimento parcial. Uma mudança técnica pode interromper processos essenciais sem que o
        impacto seja compreendido.
      mitigation: Mapear jornadas com negócio e TI e definir donos por capacidade.
    - order: 3
      text: Não há mapa confiável nem responsável pelos fluxos críticos.
      risk: red
      rationale: Uma mudança técnica pode interromper processos essenciais sem que o impacto seja compreendido.
      mitigation: Mapear jornadas com negócio e TI e definir donos por capacidade.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: mapa de fluxos de cadastro, arrecadação, fiscalização ou atendimento,
        conforme o escopo.'
  - order: 2
    text: '[CTX02] A equipe consegue explicar e alterar as regras de negócio com segurança?'
    explanation: 'Evidências: documentação, histórico de alterações e disponibilidade de especialistas. Considere
      o estado atual comprovado, não apenas planos. Se houver situações diferentes, selecione a de maior risco material
      e registre a justificativa na revisão.'
    answers:
    - order: 1
      text: Há especialistas, documentação atual e capacidade de manutenção demonstrada.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: O conhecimento está concentrado em poucas pessoas ou a documentação é parcial.
      risk: yellow
      rationale: Existe atendimento parcial. Regras tributárias pouco compreendidas aumentam o risco de regressão.
      mitigation: Registrar regras e decisões e criar testes de caracterização com especialistas.
    - order: 3
      text: Não há especialistas disponíveis ou a manutenção depende de tentativa e erro.
      risk: red
      rationale: Regras tributárias pouco compreendidas aumentam o risco de regressão.
      mitigation: Registrar regras e decisões e criar testes de caracterização com especialistas.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: documentação, histórico de alterações e disponibilidade de
        especialistas.'
  - order: 3
    text: '[CTX03] Picos, prazos e objetivos de continuidade orientam a arquitetura?'
    explanation: 'Evidências: volumetria, calendário fiscal, latência, RTO e RPO acordados. Considere o estado atual
      comprovado, não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre
      a justificativa na revisão.'
    answers:
    - order: 1
      text: Os objetivos são conhecidos e foram testados em carga e recuperação.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há estimativas ou objetivos definidos, mas sem teste completo.
      risk: yellow
      rationale: Existe atendimento parcial. Indisponibilidade em prazos críticos pode comprometer atendimento e
        processamento.
      mitigation: Acordar metas com o negócio e testar os picos e a recuperação.
    - order: 3
      text: Não há objetivos ou o sistema já falha em períodos críticos sem tratamento.
      risk: red
      rationale: Indisponibilidade em prazos críticos pode comprometer atendimento e processamento.
      mitigation: Acordar metas com o negócio e testar os picos e a recuperação.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: volumetria, calendário fiscal, latência, RTO e RPO acordados.'
  - order: 4
    text: '[CTX04] Existe visão atual da arquitetura e das dependências externas?'
    explanation: 'Evidências: diagramas de contexto e componentes, inventário de runtimes e interfaces. Considere
      o estado atual comprovado, não apenas planos. Se houver situações diferentes, selecione a de maior risco material
      e registre a justificativa na revisão.'
    answers:
    - order: 1
      text: Visão atualizada identifica componentes, tecnologias, responsáveis e dependências.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Diagramas ou inventários existem, mas estão incompletos.
      risk: yellow
      rationale: Existe atendimento parcial. Dependências ocultas tornam a modernização imprevisível.
      mitigation: Construir mapa de dependências e validá-lo com execução e equipes consumidoras.
    - order: 3
      text: Dependências e componentes só são descobertos durante incidentes.
      risk: red
      rationale: Dependências ocultas tornam a modernização imprevisível.
      mitigation: Construir mapa de dependências e validá-lo com execução e equipes consumidoras.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: diagramas de contexto e componentes, inventário de runtimes
        e interfaces.'
- order: 2
  name: 02. Monólito, modularidade e acoplamento
  comment: Um monólito modular pode ser adequado. Serviços distribuídos também podem apresentar acoplamento elevado.
  questions:
  - order: 1
    text: '[ARQ01] Como as capacidades de negócio estão separadas no código?'
    explanation: 'Evidências: estrutura de módulos e regras de dependência. Considere o estado atual comprovado,
      não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa
      na revisão.'
    answers:
    - order: 1
      text: Há módulos coesos e fronteiras verificadas, em monólito ou serviços.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há separação parcial, com violações conhecidas.
      risk: yellow
      rationale: Existe atendimento parcial. A mistura de responsabilidades amplia o impacto de cada alteração.
      mitigation: Criar módulos por capacidade e impedir novas dependências cíclicas.
    - order: 3
      text: Regras de vários domínios estão misturadas e há dependências cíclicas frequentes.
      risk: red
      rationale: A mistura de responsabilidades amplia o impacto de cada alteração.
      mitigation: Criar módulos por capacidade e impedir novas dependências cíclicas.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: estrutura de módulos e regras de dependência.'
  - order: 2
    text: '[ARQ02] Uma alteração localizada exige mudanças em outros módulos ou sistemas?'
    explanation: 'Evidências: histórico de três mudanças recentes e seu impacto. Considere o estado atual comprovado,
      não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa
      na revisão.'
    answers:
    - order: 1
      text: Mudanças normalmente ficam no domínio responsável, com contratos estáveis.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Algumas mudanças atravessam domínios e exigem coordenação manual.
      risk: yellow
      rationale: Existe atendimento parcial. O acoplamento de mudança reduz autonomia e aumenta regressões.
      mitigation: Identificar dependências recorrentes e introduzir contratos e encapsulamento.
    - order: 3
      text: Mudanças pequenas exigem alterações simultâneas em vários sistemas.
      risk: red
      rationale: O acoplamento de mudança reduz autonomia e aumenta regressões.
      mitigation: Identificar dependências recorrentes e introduzir contratos e encapsulamento.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: histórico de três mudanças recentes e seu impacto.'
  - order: 3
    text: '[ARQ03] É possível evoluir e publicar as unidades arquiteturais na cadência necessária?'
    explanation: 'Evidências: pipeline e histórico de releases. Considere o estado atual comprovado, não apenas
      planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa na
      revisão.'
    answers:
    - order: 1
      text: A unidade de implantação atende à cadência necessária; serviços, se existentes, evoluem com compatibilidade.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há coordenação ocasional ou gargalos de publicação conhecidos.
      risk: yellow
      rationale: Existe atendimento parcial. O acoplamento de implantação impede entregas independentes quando necessárias.
      mitigation: Reduzir dependências de release e avaliar extração apenas onde há benefício comprovado.
    - order: 3
      text: Há releases sincronizados obrigatórios entre sistemas ou um pacote único bloqueia necessidades distintas.
      risk: red
      rationale: O acoplamento de implantação impede entregas independentes quando necessárias.
      mitigation: Reduzir dependências de release e avaliar extração apenas onde há benefício comprovado.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: pipeline e histórico de releases.'
  - order: 4
    text: '[ARQ04] As partes com maior carga podem ser escaladas de forma economicamente adequada?'
    explanation: 'Evidências: perfil de consumo por fluxo e resultados de testes. Considere o estado atual comprovado,
      não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa
      na revisão.'
    answers:
    - order: 1
      text: A escala atual atende às metas e ao custo, com isolamento onde necessário.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Escalar tudo atende parcialmente, com desperdício ou contenção moderada.
      risk: yellow
      rationale: Existe atendimento parcial. A disputa de recursos amplia o raio de impacto de picos.
      mitigation: Medir gargalos e isolar pools, processos ou serviços conforme a necessidade.
    - order: 3
      text: Um fluxo satura recursos e derruba outros, sem isolamento ou capacidade viável.
      risk: red
      rationale: A disputa de recursos amplia o raio de impacto de picos.
      mitigation: Medir gargalos e isolar pools, processos ou serviços conforme a necessidade.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: perfil de consumo por fluxo e resultados de testes.'
- order: 3
  name: 03. Fronteiras de domínio e decomposição
  comment: Avaliar modularização antes de distribuir. Microserviços exigem motivação, autonomia e capacidade operacional.
  questions:
  - order: 1
    text: '[DOM01] As fronteiras de domínio foram validadas com especialistas do negócio?'
    explanation: 'Evidências: mapa de contextos, linguagem de negócio e decisões de arquitetura. Considere o estado
      atual comprovado, não apenas planos. Se houver situações diferentes, selecione a de maior risco material e
      registre a justificativa na revisão.'
    answers:
    - order: 1
      text: Capacidades, regras e interfaces têm fronteiras acordadas.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há proposta técnica de divisão ainda não validada pelo negócio.
      risk: yellow
      rationale: Existe atendimento parcial. Fronteiras inadequadas podem criar um monólito distribuído.
      mitigation: Realizar oficina de domínio e validar contextos e invariantes com especialistas.
    - order: 3
      text: A divisão segue apenas tabelas ou camadas técnicas, misturando responsabilidades.
      risk: red
      rationale: Fronteiras inadequadas podem criar um monólito distribuído.
      mitigation: Realizar oficina de domínio e validar contextos e invariantes com especialistas.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: mapa de contextos, linguagem de negócio e decisões de arquitetura.'
  - order: 2
    text: '[DOM02] A decisão de manter o monólito ou extrair serviços tem justificativa mensurável?'
    explanation: 'Evidências: registro de decisão e metas de prazo, escala, custo e disponibilidade. Considere o
      estado atual comprovado, não apenas planos. Se houver situações diferentes, selecione a de maior risco material
      e registre a justificativa na revisão.'
    answers:
    - order: 1
      text: A decisão compara alternativas e demonstra benefício; manter monólito modular é uma opção válida.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há hipótese de benefício, mas sem métricas ou comparação completa.
      risk: yellow
      rationale: Existe atendimento parcial. Distribuição sem benefício pode elevar custo e complexidade operacional.
      mitigation: Comparar modularização interna, replatform e extração seletiva com métricas.
    - order: 3
      text: Pretende-se extrair serviços por padrão ou manter gargalos sem avaliar alternativas.
      risk: red
      rationale: Distribuição sem benefício pode elevar custo e complexidade operacional.
      mitigation: Comparar modularização interna, replatform e extração seletiva com métricas.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: registro de decisão e metas de prazo, escala, custo e disponibilidade.'
  - order: 3
    text: '[DOM03] Existe estratégia incremental e reversível para a mudança arquitetural?'
    explanation: 'Evidências: plano de transição, roteamento, coexistência e retorno. Considere o estado atual comprovado,
      não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa
      na revisão.'
    answers:
    - order: 1
      text: Há etapas pequenas, critérios de aceite, coexistência e retorno; ou a manutenção da arquitetura está
        justificada.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Existe piloto, mas coexistência ou retorno ainda não estão resolvidos.
      risk: yellow
      rationale: Existe atendimento parcial. Uma transição de grande porte concentra risco operacional.
      mitigation: Definir fatia de negócio, camada de adaptação e piloto com reversão.
    - order: 3
      text: A mudança depende de substituição integral sem retorno testável.
      risk: red
      rationale: Uma transição de grande porte concentra risco operacional.
      mitigation: Definir fatia de negócio, camada de adaptação e piloto com reversão.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: plano de transição, roteamento, coexistência e retorno.'
  - order: 4
    text: '[DOM04] Cada unidade tem responsabilidade de equipe e capacidade de operação compatíveis?'
    explanation: 'Evidências: responsáveis, plantão, acordos entre equipes e backlog. Considere o estado atual comprovado,
      não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa
      na revisão.'
    answers:
    - order: 1
      text: Há responsabilidade pelo ciclo completo de cada unidade, compatível com sua arquitetura.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Responsabilidades existem, mas dependem de muitos repasses.
      risk: yellow
      rationale: Existe atendimento parcial. Fragmentação sem ownership aumenta falhas e tempo de recuperação.
      mitigation: Acordar responsabilidades, suporte e capacidade antes de ampliar o número de serviços.
    - order: 3
      text: Serviços são propostos ou operados sem responsáveis e suporte definidos.
      risk: red
      rationale: Fragmentação sem ownership aumenta falhas e tempo de recuperação.
      mitigation: Acordar responsabilidades, suporte e capacidade antes de ampliar o número de serviços.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: responsáveis, plantão, acordos entre equipes e backlog.'
- order: 4
  name: 04. Dados, banco compartilhado e transações
  comment: Priorizar propriedade lógica dos dados e integridade; não exigir um servidor físico de banco por serviço.
  questions:
  - order: 1
    text: '[DAD01] Quem pode ler e alterar os dados de cada domínio?'
    explanation: 'Evidências: matriz de acesso, schemas e SQL entre aplicações. Considere o estado atual comprovado,
      não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa
      na revisão.'
    answers:
    - order: 1
      text: Há dono por conjunto de dados e escrita encapsulada; compartilhamento físico tem isolamento lógico controlado.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há leituras diretas entre domínios ou exceções de escrita conhecidas.
      risk: yellow
      rationale: Existe atendimento parcial. Banco compartilhado pode acoplar regras e implantação e comprometer
        integridade.
      mitigation: Definir proprietário de escrita e substituir acessos cruzados por contratos apropriados.
    - order: 3
      text: Múltiplas aplicações gravam nas mesmas tabelas sem dono ou contrato.
      risk: red
      rationale: Banco compartilhado pode acoplar regras e implantação e comprometer integridade.
      mitigation: Definir proprietário de escrita e substituir acessos cruzados por contratos apropriados.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: matriz de acesso, schemas e SQL entre aplicações.'
  - order: 2
    text: '[DAD02] As regras em procedures e triggers estão mapeadas e testadas?'
    explanation: 'Evidências: inventário de rotinas e seus consumidores. Considere o estado atual comprovado, não
      apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre a justificativa
      na revisão.'
    answers:
    - order: 1
      text: Regras e dependências estão documentadas e testadas, ou não há regras no banco após verificação.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Há regras conhecidas, mas cobertura e dependências são parciais.
      risk: yellow
      rationale: Existe atendimento parcial. Extrair código sem essas regras pode alterar o comportamento fiscal.
      mitigation: Mapear rotinas, caracterizar o comportamento e decidir onde cada regra deve residir.
    - order: 3
      text: Regras críticas estão ocultas em rotinas compartilhadas sem testes.
      risk: red
      rationale: Extrair código sem essas regras pode alterar o comportamento fiscal.
      mitigation: Mapear rotinas, caracterizar o comportamento e decidir onde cada regra deve residir.
    - order: 4
      text: Não sabemos ou não temos evidências suficientes.
      risk: unknown
      rationale: A falta de evidência impede avaliar este aspecto com segurança.
      mitigation: 'Envolver o responsável e levantar: inventário de rotinas e seus consumidores.'
  - order: 3
    text: '[DAD03] As transações preservam as invariantes de negócio na arquitetura proposta?'
    explanation: 'Evidências: limites transacionais, reconciliação e cenários de falha. Considere o estado atual
      comprovado, não apenas planos. Se houver situações diferentes, selecione a de maior risco material e registre
      a justificativa na revisão.'
    answers:
    - order: 1
      text: A atomicidade necessária permanece local ou há consistência e compensação validadas.
      risk: green
      rationale: A condição descrita reduz o risco neste aspecto; confirme com as evidências solicitadas.
      mitigation: Manter a prática e revalidar após mudanças relevantes.
    - order: 2
      text: Transações cruzadas são conhecidas, mas falhas e compensação não foram validadas.
      risk: yellow
      rationale: Existe atendimento parcial. Falhas parciais podem gerar lançamentos inconsistentes ou duplicados.
      mitigation: Definir invariantes com negócio, manter juntas as operações inseparáveis e testar compensação
        quando cabível.
    - order: 3
      text: A divisão quebra atomicidade necessária ou depende de transações distribuídas sem estratégia testada.
      risk: red
      rationale: Falhas parciais podem gerar lançamentos inconsistentes ou duplicados.
      mitigation: Definir invariantes com negócio, manter juntas as operações inseparáveis e testar compensação
