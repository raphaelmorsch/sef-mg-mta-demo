- ruleID: sefmg-model-arrecadacao-to-contribuinte-001
  category: potential
  effort: 5
  description: "Modelo de outro domínio usado por Arrecadação"
  message: >-
    Arrecadação depende do modelo interno Contribuinte. Defina um identificador ou DTO do
    contrato e traduza para o modelo dentro do domínio proprietário. Esta referência fecha o
    ciclo conhecido apenas se Contribuinte → Débito e Débito → Arrecadação também estiverem
    presentes.
  labels:
    - "sefmg.gov.br/concern=monolith-decoupling"
  when:
    and:
      - builtin.file:
          pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/arrecadacao/.*\\.java$"
        as: origin
        ignore: true
      - java.referenced:
          pattern: "br.gov.mg.sef.fiscal.contribuinte.Contribuinte"
          location: TYPE
          filepaths: ["{{#origin.extras.filepaths}}{{.}} {{/origin.extras.filepaths}}"]
        from: origin

- ruleID: sefmg-shared-to-domain-001
  category: potential
  effort: 5
  description: "Shared depende de um domínio de negócio"
  message: >-
    Shared deve permanecer independente dos domínios. Mova a lógica específica para o domínio
    proprietário ou inverta a dependência por contrato. Dependências domínio → shared são
    permitidas por esta política; shared → domínio requer revisão.
  labels:
    - "sefmg.gov.br/concern=monolith-decoupling"
  when:
    and:
      - builtin.file:
          pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/shared/.*\\.java$"
        as: shared_files
        ignore: true
      - or:
          - java.referenced:
              pattern: "br.gov.mg.sef.fiscal.contribuinte.*"
              location: TYPE
              filepaths: ["{{#shared_files.extras.filepaths}}{{.}} {{/shared_files.extras.filepaths}}"]
            from: shared_files
          - java.referenced:
              pattern: "br.gov.mg.sef.fiscal.debito.*"
              location: TYPE
              filepaths: ["{{#shared_files.extras.filepaths}}{{.}} {{/shared_files.extras.filepaths}}"]
            from: shared_files
          - java.referenced:
              pattern: "br.gov.mg.sef.fiscal.arrecadacao.*"
              location: TYPE
              filepaths: ["{{#shared_files.extras.filepaths}}{{.}} {{/shared_files.extras.filepaths}}"]
            from: shared_files
          - java.referenced:
              pattern: "br.gov.mg.sef.fiscal.notificacao.*"
              location: TYPE
              filepaths: ["{{#shared_files.extras.filepaths}}{{.}} {{/shared_files.extras.filepaths}}"]
            from: shared_files

- ruleID: sefmg-cycle-contribuinte-debito-arrecadacao-001
  category: potential
  effort: 8
  description: "Ciclo entre três domínios: Contribuinte → Débito → Arrecadação → Contribuinte"
  message: >-
    As três direções do ciclo conhecido foram encontradas no escopo analisado. Priorize remover
    a dependência do modelo Contribuinte em Arrecadação e extraia contratos para
    quitação/pagamento. Confirme o ciclo no grafo jdeps após cada alteração. Esta regra
    correlaciona referências estáticas entre pacotes, não demonstra recursão em execução nem
    descobre ciclos arbitrários. Os incidentes também aparecem nas regras direcionais; não some
    seus esforços como trabalhos independentes.
  labels:
    - "sefmg.gov.br/concern=monolith-decoupling"
  when:
    and:
      - and:
          - builtin.file:
              pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/contribuinte/.*\\.java$"
            as: cycle_0
            ignore: true
          - java.referenced:
              pattern: "br.gov.mg.sef.fiscal.debito.*"
              location: TYPE
              filepaths: ["{{#cycle_0.extras.filepaths}}{{.}} {{/cycle_0.extras.filepaths}}"]
            from: cycle_0
      - and:
          - builtin.file:
              pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/debito/.*\\.java$"
            as: cycle_1
            ignore: true
          - java.referenced:
              pattern: "br.gov.mg.sef.fiscal.arrecadacao.*"
              location: TYPE
              filepaths: ["{{#cycle_1.extras.filepaths}}{{.}} {{/cycle_1.extras.filepaths}}"]
            from: cycle_1
      - and:
          - builtin.file:
              pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/arrecadacao/.*\\.java$"
            as: cycle_2
            ignore: true
          - java.referenced:
              pattern: "br.gov.mg.sef.fiscal.contribuinte.*"
              location: TYPE
              filepaths: ["{{#cycle_2.extras.filepaths}}{{.}} {{/cycle_2.extras.filepaths}}"]
            from: cycle_2
