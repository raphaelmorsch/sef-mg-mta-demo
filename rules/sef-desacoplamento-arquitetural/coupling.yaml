# Política da architecture-demo. Escopo Maven src/main/java; caminhos seguem os pacotes.
# MTA 8.3: extras.filepaths preserva a lista original de builtin.file.
# O provider divide por espaço o primeiro elemento; a seção Mustache concatena os caminhos.
# Use um checkout sem espaços no caminho (limitação do provider).
# Nenhuma regra proíbe domínio → shared ou referências no próprio domínio.

- ruleID: sefmg-coupling-contribuinte-to-debito-001
  category: potential
  effort: 5
  description: "Acoplamento entre domínios: contribuinte → debito"
  message: >-
    O domínio contribuinte referencia diretamente debito. ContribuinteService instancia
    DebitoService para quitar débitos. Extraia uma porta de regularização e mantenha a
    implementação no domínio Débito. Esta direção participa do ciclo conhecido contribuinte →
    debito → arrecadacao → contribuinte quando as outras duas arestas também existem. A
    ocorrência isolada não comprova o ciclo. Uma interface só reduz acoplamento se o consumidor
    depender do contrato; não substitua chamadas locais por HTTP sem avaliar os limites de
    negócio.
  labels:
    - "sefmg.gov.br/concern=monolith-decoupling"
    - "sefmg.gov.br/source-domain=contribuinte"
    - "sefmg.gov.br/destination-domain=debito"
  when:
    and:
      - builtin.file:
          pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/contribuinte/.*\\.java$"
        as: origin
        ignore: true
      - java.referenced:
          pattern: "br.gov.mg.sef.fiscal.debito.*"
          location: TYPE
          filepaths: ["{{#origin.extras.filepaths}}{{.}} {{/origin.extras.filepaths}}"]
        from: origin

- ruleID: sefmg-coupling-contribuinte-to-arrecadacao-001
  category: potential
  effort: 5
  description: "Acoplamento entre domínios: contribuinte → arrecadacao"
  message: >-
    O domínio contribuinte referencia diretamente arrecadacao. Revise a fronteira: para
    services, introduza uma porta/API explícita; para repositories/DAO, delegue o acesso aos
    dados ao domínio proprietário; para impl/internal, exponha um contrato; para modelos, use
    identificadores ou DTOs de contrato. Uma interface só reduz acoplamento se o consumidor
    depender do contrato; não substitua chamadas locais por HTTP sem avaliar os limites de
    negócio.
  labels:
    - "sefmg.gov.br/concern=monolith-decoupling"
    - "sefmg.gov.br/source-domain=contribuinte"
    - "sefmg.gov.br/destination-domain=arrecadacao"
  when:
    and:
      - builtin.file:
          pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/contribuinte/.*\\.java$"
        as: origin
        ignore: true
      - java.referenced:
          pattern: "br.gov.mg.sef.fiscal.arrecadacao.*"
          location: TYPE
          filepaths: ["{{#origin.extras.filepaths}}{{.}} {{/origin.extras.filepaths}}"]
        from: origin

