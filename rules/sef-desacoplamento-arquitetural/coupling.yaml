- ruleID: sefmg-construction-contribuinte-to-debito-001
  category: potential
  effort: 5
  description: "Instanciação direta de implementação: DebitoService"
  message: >-
    contribuinte constrói DebitoService, controlando a implementação e seu ciclo de vida fora do
    domínio proprietário. Injete uma porta definida pela fronteira de negócio e mova a
    composição para a configuração da aplicação. Injeção da mesma classe concreta, sozinha, não
    elimina a dependência entre domínios.
  labels:
    - "sefmg.gov.br/concern=monolith-decoupling"
  when:
    and:
      - builtin.file:
          pattern: "(^|/)src/main/java/br/gov/mg/sef/fiscal/contribuinte/.*\\.java$"
        as: origin
        ignore: true
      - java.referenced:
          pattern: "br.gov.mg.sef.fiscal.debito.DebitoService"
          location: CONSTRUCTOR_CALL
          filepaths: ["{{#origin.extras.filepaths}}{{.}} {{/origin.extras.filepaths}}"]
        from: origin

